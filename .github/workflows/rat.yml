name: RAT license check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rat:
    name: Apache RAT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: dev/release/run-rat.sh
