name: sqllogictest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqllogictest:
    name: Run sqllogictests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p datafusion-spark-sqllogictest
